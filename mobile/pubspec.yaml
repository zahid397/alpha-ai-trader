name: crimson_arena
description: "Crimson Arena mobile: the C# WebAssembly game bundled in a Flutter app, fully offline, with the Main Boss sold through RevenueCat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1
  purchases_flutter: ^10.13.2
  purchases_ui_flutter: ^10.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # The whole web game (HTML, JS, CSS, sprites, fonts and the C# engine's
  # WebAssembly), copied from public/game by `npm run mobile:assets`.
  assets:
    # game-assets:start (generated by scripts/sync-mobile-assets.mjs)
    - assets/game/
    - assets/game/assets/
    - assets/game/engine/_framework/
    - assets/game/fonts/
    - assets/game/js/
    # game-assets:end
